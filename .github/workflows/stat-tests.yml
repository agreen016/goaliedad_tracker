name: Stat Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  stat-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Run stat tests
        run: flutter test test/stat_coverage_test.dart test/stat_edgecases_test.dart --reporter=expanded
