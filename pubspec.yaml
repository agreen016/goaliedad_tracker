
name: goaliedad_tracker
description: "Goalie Dad Stats Tracker — a modular, expandable app for tracking goalie performance and game stats."
publish_to: 'none'

version: 1.0.2+7

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Core packages
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.11
  go_router: ^10.1.0
  uuid: ^4.0.0
  flutter_colorpicker: ^1.1.0
  image_picker: ^1.0.4
  intl: ^0.18.1
  collection: ^1.17.2
  pdf: ^3.11.0
  printing: ^5.10.0
  
  # In-app purchases
  in_app_purchase: ^3.1.13
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_test: ^1.0.0
  test: ^1.24.0

  # Hive code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/default_team_logo.png
    - assets/ice_rink.png
    - assets/center_ice.png
    - assets/Goalie_in_net.png
    - assets/zones/default_goalie_zones.json

flutter_icons:
  android: true
  ios: true
  image_path: "assets/Goalie_in_net.png"
        
  # Assets and fonts can be added here later
  # assets:
  #   - assets/images/
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
